# 仅用于离线仿真调参，不会直接向PX4发送指令。
controller:
  # 位置/速度误差增益；增大响应更快，但过大会振荡或产生强制动。
  k1: 0.02
  k2: 20.0
  # 允许的视线偏角(deg)；内部使用k_b=1-cos(angle)。
  safe_los_angle_deg: 60.0
  # 仿真质量(kg)，应与被控模型一致。
  mass_kg: 2.0
  # 最大推力(N)与归一化悬停推力，需成套标定。
  thrust_max_n: 26.9784
  hover_thrust_normalized: 0.727
  # 机体角速度上限(rad/s)；越大姿态响应越快，风险也越高。
  omega_max_rad_s: 0.5

simulation:
  # 论文外环/内环频率(Hz)，内环频率必须是外环的整数倍。
  outer_loop_hz: 50
  inner_loop_hz: 200
  # 单次仿真最长时间(s)和命中判定半径(m)。
  duration_s: 40.0
  hit_radius_m: 0.5
  # 离线安全限值：速度(m/s)和倾角(deg)。
  speed_limit_m_s: 2.0
  tilt_limit_deg: 20.0
  # 初始相对位置/速度，ENU坐标系，单位m和m/s。
  initial_p_r_e: [-12.0, -1.0, -1.0]
  initial_v_r_e: [0.0, 0.0, 0.0]
  # 机体系中的相机光轴方向，FLU坐标。
  camera_axis_b: [1.0, 0.0, 0.0]
