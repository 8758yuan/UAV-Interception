px4_command_adapter:
  ros__parameters:
    # Gazebo仿真使用true；实机使用false。
    use_sim_time: true

    # 输出安全锁：只有enable_control=true且确认字符串正确时才向PX4发指令。
    enable_control: false
    confirmation_token: ''

    # 物理/推力标定参数；质量或电机模型变化后必须重新标定。
    mass_kg: 2.1143076923
    hover_thrust_normalized: 0.5219057941
    maximum_thrust_n: 58.8399
    # PX4/Gazebo推力曲线指数和电机最小输出比例。
    thrust_curve_exponent: 2.0
    actuator_minimum_fraction: 0.15
    # 角速度限幅(rad/s)；增大响应更快，同时提高姿态失稳风险。
    omega_limit_rad_s: 0.8
    # 调试指令超过该时间未更新则停止使用(s)。
    command_timeout_s: 0.1
    # PX4角速度设定点发布频率(Hz)。
    publish_rate_hz: 200.0

    # 输入调试话题和PX4输出话题，一般不需要调整。
    debug_topic: /interception/control/debug
    rates_setpoint_topic: /fmu/in/vehicle_rates_setpoint
